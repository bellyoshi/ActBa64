name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 60
    env:
      # ブートストラップ（stage0）に使うリリース。ActiveBasic 4.20 は CI に置けないため
      BOOTSTRAP_TAG: v0.1.9
    steps:
      - uses: actions/checkout@v4

      - name: Download bootstrap compiler
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $dir = Join-Path $env:RUNNER_TEMP "bootstrap"
          New-Item -ItemType Directory -Force -Path $dir | Out-Null
          gh release download $env:BOOTSTRAP_TAG -R $env:GITHUB_REPOSITORY -p "*.zip" -D $dir
          Get-ChildItem -LiteralPath $dir -Filter *.zip | ForEach-Object {
            Expand-Archive -LiteralPath $_.FullName -DestinationPath (Join-Path $dir "x") -Force
          }
          $exe = Get-ChildItem -LiteralPath (Join-Path $dir "x") -Recurse -Filter actba64.exe | Select-Object -First 1
          if ($null -eq $exe) { throw "actba64.exe not found in $env:BOOTSTRAP_TAG" }
          "BOOTSTRAP_EXE=$($exe.FullName)" | Out-File -Append -Encoding utf8 $env:GITHUB_ENV

      - name: Build and test
        shell: pwsh
        run: .\ci.ps1 -Bootstrap $env:BOOTSTRAP_EXE
